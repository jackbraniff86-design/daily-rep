<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Daily Rep</title>
<meta name="description" content="Five questions. Every day. How well do you know your training?">
<meta property="og:title" content="The Daily Rep">
<meta property="og:description" content="Five questions. Every day. How well do you know your training?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap">
<style>
/* Typewriter type on a cool Nordic ground: one monospace family, hairlines, square corners, lots of air. Fjord blue marks your answers; green/amber/red are for scoring only. */
:root{
  --bg:#edf0f2; --card:#f7f9fa; --ink:#1b2229; --muted:#6a7681; --line:#cfd7dd;
  --accent:#2f5d8a; --accent-ink:#f7f9fa;
  --good:#3f8f72; --ok:#c4942f; --bad:#c0564b;
  --sea:#e0e7ec; --land:#bfcad3; --fig:#c3cdd5;
  --f-head:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-body:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --card:#182028; --ink:#e4eaee; --muted:#85929e; --line:#28323c;
  --accent:#8fb6dc; --accent-ink:#11161b;
  --good:#5fc49c; --ok:#e0b458; --bad:#e6796d;
  --sea:#151c23; --land:#2b3742; --fig:#33404c;
}}
:root[data-theme="dark"]{
  --bg:#11161b; --card:#182028; --ink:#e4eaee; --muted:#85929e; --line:#28323c;
  --accent:#8fb6dc; --accent-ink:#11161b;
  --good:#5fc49c; --ok:#e0b458; --bad:#e6796d;
  --sea:#151c23; --land:#2b3742; --fig:#33404c;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease}
#app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:18px;
  padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.home,.q{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--f-head);font-weight:500;font-size:15px;letter-spacing:-.02em;text-transform:lowercase;background:none;border:0;color:var(--ink);padding:0;cursor:pointer}
.logo i,h1 i{font-style:normal;color:var(--accent)}
.top .tools{display:flex;gap:6px}
button{font:inherit;cursor:pointer;color:inherit;letter-spacing:inherit}
.mini{background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:border-color .2s,color .2s}
a.mini{text-decoration:none;font-size:11px}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.btn{display:block;width:100%;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:4px;padding:17px 18px;font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;transition:opacity .2s,transform .15s}
.btn:hover{opacity:.88} .btn:active{transform:scale(.99)}
.btn:disabled{opacity:.3;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.mini:focus-visible,.logo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1{font-family:var(--f-head);font-weight:500;font-size:clamp(34px,10.5vw,58px);line-height:1;letter-spacing:-.06em;text-transform:lowercase;margin:0}
.caret{display:inline-block;width:.5em;height:.82em;margin-left:.08em;background:var(--accent);vertical-align:baseline;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h2{font-family:var(--f-head);font-weight:500;font-size:clamp(19px,5.2vw,23px);line-height:1.3;letter-spacing:-.03em;margin:0;text-wrap:balance}
.lede{font-size:15px;color:var(--muted);margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts.two{grid-template-columns:repeat(2,1fr)}
.fact{border:1px solid var(--line);border-radius:4px;padding:12px}
.fact b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.fact span{font-size:11px;color:var(--muted)}
.hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero b{font-weight:500;font-size:clamp(40px,12vw,58px);line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.hero span{color:var(--muted);font-size:13px}
.hero.streak b{color:var(--accent)}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:3px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--ink)} .dots i.g{background:var(--good)} .dots i.o{background:var(--ok)} .dots i.b{background:var(--bad)}
.q{display:flex;flex-direction:column;gap:16px;flex:1}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.clock{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.low{color:var(--bad)}
.timer{height:2px;background:var(--line);margin-top:-8px}
.timer i{display:block;height:100%;width:100%;background:var(--ink);transition:width .12s linear}
.timer.low i{background:var(--bad)}
.control{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.spacer{flex:1}
.points{display:flex;align-items:baseline;gap:10px}
.points b{font-size:46px;font-weight:500;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.points span{color:var(--muted);font-size:13px}
.points.g b{color:var(--good)} .points.o b{color:var(--ok)} .points.b b{color:var(--bad)}
.explain{margin:0;padding-left:12px;border-left:2px solid var(--ink);color:var(--muted)}
.verdict{margin:0;font-weight:500}
/* slider */
.readout{font-size:40px;font-weight:500;text-align:center;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.1}
.readout small{font-size:14px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--muted)}
input[type=range]::-moz-range-track{height:2px;background:var(--muted)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:34px;border-radius:2px;background:var(--accent);border:0;margin-top:-16px}
input[type=range]::-moz-range-thumb{width:14px;height:34px;border-radius:2px;background:var(--accent);border:0}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.track{position:relative;height:60px;margin:8px 8px 0}
.track::before{content:"";position:absolute;left:0;right:0;top:29px;height:2px;background:var(--muted)}
.track .band{position:absolute;top:24px;height:12px;background:var(--good);opacity:.35}
.track .mk{position:absolute;top:14px;width:3px;height:32px;margin-left:-1.5px;transition:left .7s cubic-bezier(.2,.7,.2,1)}
.track .mk.you{background:var(--accent)} .track .mk.ans{background:var(--good)}
.track .mk span{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
.track .mk.you span{top:-17px;color:var(--accent)} .track .mk.ans span{top:35px;color:var(--good)}
/* map */
.map{position:relative;border-radius:4px;overflow:hidden;background:var(--sea)}
.map canvas{display:block;width:100%;height:min(62vw,330px);touch-action:none;cursor:crosshair}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:36px;height:36px;border-radius:4px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;text-align:center}
/* graph + body */
svg{display:block;width:100%;height:auto}
.graph{touch-action:none;cursor:crosshair}
.graph text{font-family:var(--f-mono);font-size:16px;fill:var(--muted)}
.bodywrap{display:flex;justify-content:center}
.body{max-height:min(52vh,400px);width:auto;cursor:crosshair;touch-action:manipulation}
/* order */
.cards{display:flex;flex-direction:column;gap:6px}
.cardrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:9px 12px;text-align:left;width:100%;transition:border-color .2s}
.cardrow .n{color:var(--muted);width:1.6em}
.cardrow .t{flex:1}
.cardrow.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cardrow.g{border-color:var(--good)} .cardrow.o{border-color:var(--ok)} .cardrow.b{border-color:var(--bad)}
.cardrow .mv{display:flex;gap:4px}
.cardrow .mv button{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);background:transparent}
/* results + stats */
.score{font-weight:500;font-size:clamp(52px,16vw,78px);line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.score small{font-size:.3em;color:var(--muted);letter-spacing:0}
.squares{font-size:26px;letter-spacing:4px}
.rows{display:flex;flex-direction:column;gap:6px}
.rowbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;padding:10px 12px;transition:border-color .2s}
.rowbtn:hover{border-color:var(--ink)}
.rowbtn .t{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn b{font-weight:500;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:70px 1fr 28px;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.bar i{display:block;height:10px;background:var(--ink);min-width:2px}
.legal{font-size:11px;color:var(--muted);text-align:center;margin:0}
.bank{display:flex;flex-direction:column;gap:10px}
.bank article{border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:13px}
.bank article b{display:block;font-weight:500}
@media (prefers-reduced-motion:reduce){.track .mk,.timer i{transition:none}.home,.q,.caret{animation:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(() => {
'use strict';
const CONFIG = {
  name: 'The Daily Rep',
  launch: '2026-09-30',     // the date of day #1
  url: '',                  // shown in the share text once the site has a home, e.g. 'dailyrep.app'
  mapData: 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
};

// ---------- question bank ----------
// type: slider | mappin | graphpin | order | bodypin.  topic: hyrox | running | strength | physiology | nutrition | anatomy | events.  difficulty 1–3.
// Body pin targets are in the 200 × 440 outline's own units.
const LEG = {quads:[{x:81,y:272},{x:119,y:272}], hams:[{x:81,y:278},{x:119,y:278}], glutes:[{x:84,y:234},{x:116,y:234}],
  knees:[{x:82,y:318},{x:118,y:318}], shins:[{x:85,y:366},{x:115,y:366}], calves:[{x:83,y:352},{x:117,y:352}], achilles:[{x:83,y:400},{x:117,y:400}]};
const BANK = [
  // HYROX
  {id:'hx-order-1', type:'order', topic:'hyrox', difficulty:1, q:'Put the first four HYROX stations in race order.',
   items:['SkiErg','Sled Push','Sled Pull','Burpee Broad Jumps'], explain:'Every HYROX race runs the same eight stations in the same order, each after a 1 km run.'},
  {id:'hx-order-2', type:'order', topic:'hyrox', difficulty:2, q:'Put these HYROX stations in race order.',
   items:['SkiErg','Sled Pull','Row','Sandbag Lunges','Wall Balls'], explain:'SkiErg is station 1, Sled Pull 3, Row 5, Sandbag Lunges 7 and Wall Balls 8.'},
  {id:'hx-order-3', type:'order', topic:'hyrox', difficulty:2, q:'Order these HYROX stations by distance, shortest first.',
   items:['Sled Push','Burpee Broad Jumps','Sandbag Lunges','Farmers Carry','SkiErg'], explain:'Sled Push 50 m, Burpee Broad Jumps 80 m, Lunges 100 m, Farmers Carry 200 m, SkiErg 1,000 m.'},
  {id:'hx-run-km', type:'slider', topic:'hyrox', difficulty:1, q:'How many kilometres of running are in a HYROX race?',
   min:2, max:16, step:1, unit:'km', answer:8, tolerance:0, explain:'Eight 1 km runs, one before each station.'},
  {id:'hx-bbj', type:'slider', topic:'hyrox', difficulty:1, q:'How far are the burpee broad jumps in HYROX?',
   min:20, max:200, step:5, unit:'m', answer:80, tolerance:0, explain:'80 m, station four.'},
  {id:'hx-wb-reps', type:'slider', topic:'hyrox', difficulty:1, q:"How many wall balls finish a men's Open HYROX?",
   min:25, max:200, step:5, unit:'reps', answer:100, tolerance:0, explain:'100 reps with a 6 kg ball.'},
  {id:'hx-sled-push', type:'slider', topic:'hyrox', difficulty:2, q:"What is the total sled weight for the men's Open sled push?",
   min:50, max:250, step:1, unit:'kg', answer:152, tolerance:5, explain:"152 kg including the sled. Women's Open is 102 kg, men's Pro 202 kg."},
  {id:'hx-wb-height', type:'slider', topic:'hyrox', difficulty:2, q:"How high is the wall-ball target in men's HYROX divisions?",
   min:2, max:3.5, step:0.05, unit:'m', answer:3, tolerance:0.1, explain:"Around 3 m (10 ft). The women's target is about 2.7 m (9 ft)."},
  {id:'hx-farmers', type:'slider', topic:'hyrox', difficulty:2, q:"How heavy is each kettlebell in the men's Open farmers carry?",
   min:8, max:40, step:1, unit:'kg', answer:24, tolerance:0, explain:"2 × 24 kg for men's Open, 2 × 16 kg for women's Open, 2 × 32 kg for men's Pro."},
  {id:'hx-sandbag', type:'slider', topic:'hyrox', difficulty:2, q:"How heavy is the sandbag for men's Open lunges?",
   min:5, max:40, step:1, unit:'kg', answer:20, tolerance:0, explain:"20 kg for men's Open, 10 kg for women's Open, 30 kg for men's Pro."},
  {id:'hx-avg-time', type:'slider', topic:'hyrox', difficulty:2, q:'What is the average HYROX finish time across all divisions?',
   min:45, max:150, step:1, unit:'min', answer:90, tolerance:5, explain:'About an hour and a half. Roughly half of that is running.'},
  {id:'hx-first', type:'mappin', topic:'hyrox', difficulty:2, q:'Where was the first ever HYROX race held?',
   lat:53.55, lon:9.99, label:'Hamburg', explain:'HYROX was founded in Hamburg, and the first race was held there.'},
  {id:'hx-wc-2023', type:'mappin', topic:'hyrox', difficulty:2, q:'Where were the 2023 HYROX World Championships?',
   lat:53.48, lon:-2.24, label:'Manchester', explain:'Manchester hosted the 2023 World Championships.'},
  {id:'hx-wc-2024', type:'mappin', topic:'hyrox', difficulty:3, q:'Where were the 2024 HYROX World Championships?',
   lat:43.70, lon:7.27, label:'Nice', explain:'Nice, on the French Riviera, hosted the 2024 World Championships.'},
  {id:'hx-wc-2025', type:'mappin', topic:'hyrox', difficulty:2, q:'Where were the 2025 HYROX World Championships?',
   lat:41.88, lon:-87.63, label:'Chicago', explain:'Chicago hosted the 2025 World Championships.'},
  {id:'hx-sled-burn', type:'bodypin', topic:'hyrox', difficulty:1, q:'Sled push: where does the main burn hit?',
   view:'front', targets:LEG.quads, radius:22, explain:'The quads do most of the work, which is why the run straight after feels so heavy.'},
  {id:'hx-grip', type:'bodypin', topic:'hyrox', difficulty:1, q:'Farmers carry: which muscles give out first for most athletes?',
   view:'front', targets:[{x:37,y:206},{x:163,y:206}], radius:18, explain:'The forearms. Grip is usually the limiter, well before the legs or lungs.'},
  // Running
  {id:'run-marathon', type:'slider', topic:'running', difficulty:1, q:'How long is a marathon?',
   min:35, max:50, step:0.1, unit:'km', answer:42.2, tolerance:0.1, explain:'42.195 km, fixed since the 1908 London Olympics.'},
  {id:'run-half-mi', type:'slider', topic:'running', difficulty:1, q:'How long is a half marathon in miles?',
   min:8, max:20, step:0.1, unit:'mi', answer:13.1, tolerance:0.1, explain:'13.1 miles, or 21.1 km.'},
  {id:'run-pace-5', type:'slider', topic:'running', difficulty:1, q:'What speed is a pace of 5:00 per kilometre?',
   min:8, max:16, step:0.1, unit:'km/h', answer:12, tolerance:0.1, explain:'60 minutes ÷ 5 minutes per km = 12 km/h.'},
  {id:'run-3h', type:'slider', topic:'running', difficulty:2, q:'What average speed runs a 3-hour marathon?',
   min:10, max:18, step:0.1, unit:'km/h', answer:14.1, tolerance:0.2, explain:'42.195 km in 3 hours is 14.07 km/h, or about 4:16 per km.'},
  {id:'run-cadence', type:'slider', topic:'running', difficulty:2, q:'Which cadence figure is famously quoted as the elite runner benchmark?',
   min:140, max:220, step:1, unit:'spm', answer:180, tolerance:3, explain:'Jack Daniels counted about 180 steps a minute among elite racers in 1984. It is an observation, not a rule for everyone.'},
  {id:'run-kcal', type:'slider', topic:'running', difficulty:2, q:'Roughly how many kcal does a 70 kg runner burn over 10 km?',
   min:300, max:1200, step:10, unit:'kcal', answer:700, tolerance:50, explain:'About 1 kcal per kg per km, and pace changes it surprisingly little.'},
  {id:'ev-boston', type:'mappin', topic:'events', difficulty:1, q:"Where is the world's oldest annual marathon run?",
   lat:42.36, lon:-71.06, label:'Boston', explain:'The Boston Marathon has been run every year since 1897.'},
  {id:'ev-sub2', type:'mappin', topic:'events', difficulty:2, q:'Where did Eliud Kipchoge run the first sub-two-hour marathon?',
   lat:48.21, lon:16.37, label:'Vienna', explain:'1:59:40 in the Prater park, Vienna, in October 2019. It was not record-eligible because of the pacing set-up.'},
  {id:'ev-parkrun', type:'mappin', topic:'events', difficulty:2, q:'Where was the very first parkrun held?',
   lat:51.41, lon:-0.34, label:'Bushy Park, London', explain:'Bushy Park in south-west London, October 2004, with 13 runners.'},
  {id:'ev-bannister', type:'mappin', topic:'events', difficulty:2, q:'Where did Roger Bannister run the first sub-four-minute mile?',
   lat:51.75, lon:-1.26, label:'Oxford', explain:'Iffley Road track, Oxford, 6 May 1954: 3:59.4.'},
  {id:'ev-iten', type:'mappin', topic:'events', difficulty:3, q:"Where is Iten, the high-altitude town known as the 'Home of Champions'?",
   lat:0.67, lon:35.51, label:'Iten, Kenya', explain:'Iten sits at about 2,400 m in Kenya’s Rift Valley and has produced a remarkable number of world-class distance runners.'},
  {id:'ev-berlin', type:'mappin', topic:'events', difficulty:2, q:"Which city's marathon course has seen the most men's world records?",
   lat:52.52, lon:13.40, label:'Berlin', explain:'Berlin is flat, cool and fast, and has hosted more men’s marathon world records than any other course.'},
  {id:'ev-kona', type:'mappin', topic:'events', difficulty:2, q:'Where is the traditional home of the Ironman World Championship?',
   lat:19.64, lon:-155.99, label:'Kailua-Kona, Hawaii', explain:'Kona, on the Big Island of Hawaii, has hosted the championship since the early 1980s.'},
  // Physiology and testing (curves are illustrative: swap in your own anonymised lab data)
  {id:'ph-lt2', type:'graphpin', topic:'physiology', difficulty:2, q:"Tap this runner's second lactate threshold.",
   series:[[8,1.1],[9,1.3],[10,1.6],[11,2.2],[12,3.1],[13,4.6],[14,6.9]], xLabel:'km/h', yLabel:'mmol/L', answerX:12.5, tolerance:0.5, falloff:2.5,
   explain:'Lactate climbs steeply after about 12.5 km/h, close to the 4 mmol/L mark. Above this speed the effort cannot be held for long.'},
  {id:'ph-lt1', type:'graphpin', topic:'physiology', difficulty:3, q:"Tap this runner's first lactate threshold.",
   series:[[8,1.0],[9,1.0],[10,1.1],[11,1.4],[12,1.9],[13,2.8],[14,4.3],[15,6.5]], xLabel:'km/h', yLabel:'mmol/L', answerX:10.5, tolerance:0.5, falloff:2.5,
   explain:'The first threshold is the first sustained rise above baseline, here just after 10 km/h. It marks the top of easy running.'},
  {id:'ph-fatmax', type:'graphpin', topic:'physiology', difficulty:2, q:'Tap the intensity where fat burning peaks.',
   series:[[30,0.25],[40,0.38],[50,0.48],[60,0.52],[70,0.42],[80,0.25],[90,0.08]], xLabel:'% VO₂max', yLabel:'fat g/min', answerX:60, tolerance:4, falloff:25,
   explain:'Fat oxidation peaks at a moderate intensity (FatMax), then falls away as carbohydrate takes over.'},
  {id:'ph-crossover', type:'graphpin', topic:'physiology', difficulty:2, q:'Tap the crossover point, where carbohydrate overtakes fat as the main fuel.',
   series:[[40,65],[50,58],[60,50],[70,40],[80,27],[90,12]], series2:[[40,35],[50,42],[60,50],[70,60],[80,73],[90,88]], names:['Fat','Carbohydrate'],
   xLabel:'% VO₂max', yLabel:'% of energy', answerX:60, tolerance:3, falloff:20,
   explain:'The lines cross at 60% here. Endurance training moves the crossover to a higher intensity.'},
  {id:'ph-rest-lactate', type:'slider', topic:'physiology', difficulty:2, q:'What is a typical resting blood lactate?',
   min:0, max:8, step:0.1, unit:'mmol/L', answer:1, tolerance:0.4, explain:'Around 1 mmol/L at rest. A high resting value before a test is worth noting.'},
  {id:'ph-obla', type:'slider', topic:'physiology', difficulty:3, q:"Which fixed lactate value is the classic marker for the second threshold (OBLA)?",

const $ = (sel,root=document) => root.querySelector(sel);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const pad = n => String(n).padStart(2,'0');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function hash(str){ let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^h>>>16)>>>0; }
function mulberry32(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => Math.round((Date.parse(dstr(new Date())+'T00:00:00Z') - Date.parse(CONFIG.launch+'T00:00:00Z'))/864e5)+1;
const fmtNum = (v,q) => { const dp = (String(q.step||1).split('.')[1]||'').length; return Number(v).toFixed(dp); };
function haversine(lat1,lon1,lat2,lon2){ const R=6371, r=Math.PI/180, dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(a)); }
const falloff = (d,full,span) => d<=full ? 1 : Math.max(0, 1-(d-full)/span);
const nearest = (q,a) => q.targets.reduce((best,t)=>{ const d=Math.hypot(a.x-t.x,a.y-t.y); return d<best.d ? {d,t} : best; }, {d:Infinity,t:null});

// ---------- pure scoring and daily pick ----------
// score(question, answer) → accuracy 0–1. Points are round(accuracy × 100).
// A slider scores full marks inside its tolerance and falls to zero halfway to the far end of its range (or at q.zeroAt).
function score(q,a){
  if(a==null) return 0;
  if(q.type==='slider') return falloff(Math.abs(a-q.answer), q.tolerance+1e-9, (q.zeroAt || Math.max(q.answer-q.min, q.max-q.answer)/2)-q.tolerance);
  if(q.type==='graphpin') return falloff(Math.abs(a-q.answerX), q.tolerance, q.falloff);
  if(q.type==='mappin') return falloff(haversine(a.lat,a.lon,q.lat,q.lon), 100, 4900);
  if(q.type==='bodypin') return falloff(nearest(q,a).d, q.radius, q.falloff||70);
  if(q.type==='order') return a.reduce((s,item,pos)=>{ const d=Math.abs(item-pos); return s+(d===0?1:d===1?0.5:0); },0)/a.length;
  return 0;
}
// pickDaily(day, bank) → the same five questions for everyone, easiest first.
// Rules: no type twice in a row, at most two of a type and two of a topic, one HYROX question guaranteed, no repeats inside the window.
function pickDaily(day, bank){
  const windowDays = Math.min(60, Math.floor(bank.length/10)), want=[1,2,2,2,3], hist=[];   // 60 days once the bank reaches 600
  for(let d=1; d<=day; d++){
    const recent = new Set(hist.slice(-windowDays).flat());
    const pool = shuffle(bank.filter(q=>!recent.has(q.id)), mulberry32(hash('rep-'+d)));
    const pick=[], types={}, topics={};
    for(let i=0;i<5;i++){
      const prev=pick[i-1];
      const ok = (q,lvl) => !pick.includes(q) && (!prev || q.type!==prev.type) && (lvl>2 || (types[q.type]||0)<2)
        && (lvl>2 || i!==1 || q.topic==='hyrox') && (lvl>1 || (topics[q.topic]||0)<2) && (lvl>0 || q.difficulty===want[i]);
      let q; for(let lvl=0; lvl<4 && !q; lvl++) q = pool.find(c=>ok(c,lvl));
      q = q || pool.find(c=>!pick.includes(c)) || bank.find(c=>!pick.includes(c));
      pick.push(q); types[q.type]=(types[q.type]||0)+1; topics[q.topic]=(topics[q.topic]||0)+1;
    }
    hist.push(pick.map(q=>q.id));
  }
  return hist[hist.length-1].map(id=>bank.find(q=>q.id===id));
}

// World map: public-domain Natural Earth outlines, decoded from TopoJSON and drawn on a canvas you can pan and zoom.
let WORLD=null, worldPromise=null;
function loadWorld(){
  return worldPromise = worldPromise || fetch(CONFIG.mapData).then(r=>r.json()).then(t=>{
    const [kx,ky]=t.transform.scale, [dx,dy]=t.transform.translate;
    const arcs=t.arcs.map(a=>{ let x=0,y=0; return a.map(p=>{ x+=p[0]; y+=p[1]; return [x*kx+dx,y*ky+dy]; }); });
    // rings that cross the antimeridian are unwrapped past ±180 and drawn twice, so they do not streak across the map
    const ring=idxs=>{ const out=[]; for(const i of idxs){ const a=i<0? arcs[~i].slice().reverse() : arcs[i]; for(let j=out.length?1:0;j<a.length;j++) out.push(a[j].slice()); }
      for(let j=1;j<out.length;j++){ while(out[j][0]-out[j-1][0]>180) out[j][0]-=360; while(out[j][0]-out[j-1][0]<-180) out[j][0]+=360; }
      const lons=out.map(p=>p[0]); out.shift360 = Math.max(...lons)>180 ? -360 : Math.min(...lons)<-180 ? 360 : 0; return out; };
    WORLD=[]; for(const g of t.objects.countries.geometries){
      if(g.type==='Polygon') WORLD.push(g.arcs.map(ring)); else if(g.type==='MultiPolygon') for(const p of g.arcs) WORLD.push(p.map(ring)); }
  }).catch(()=>{ WORLD=[]; });
}
function mapControl(el,q,{rev,answer,onReady}){
  el.innerHTML = `<div class="map"><canvas></canvas><div class="mapbtns"><button type="button" data-z="1.6" aria-label="Zoom in">+</button><button type="button" data-z="0.625" aria-label="Zoom out">−</button></div></div>
    <p class="hint">${rev ? (answer ? 'Blue is your pin, green is the answer.' : 'Green is the answer.') : 'Tap to drop a pin. Drag to move the map, pinch or use + and − to zoom.'}</p>`;
  const cv=$('canvas',el), ctx=cv.getContext('2d'), view={lon:10,lat:22,z:1.15}; let w=1,h=1, pin=answer||null;
  const sc = () => w/360*view.z;
  const toXY = (lon,lat) => [(lon-view.lon)*sc()+w/2, (view.lat-lat)*sc()+h/2];
  const toLL = (x,y) => ({lon:(x-w/2)/sc()+view.lon, lat:view.lat-(y-h/2)/sc()});
  function fix(){ view.z=clamp(view.z,1.15,40); const hw=w/2/sc(), hh=h/2/sc();
    view.lon = hw>=180 ? 0 : clamp(view.lon,-180+hw,180-hw); view.lat = hh>=90 ? 0 : clamp(view.lat,-90+hh,90-hh); }
  function dot(lon,lat,col){ const [x,y]=toXY(lon,lat); ctx.beginPath(); ctx.arc(x,y,8,0,6.2832); ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke(); }
  function draw(){
    const dpr=Math.min(2,devicePixelRatio||1); w=cv.clientWidth||1; h=cv.clientHeight||1;
    if(cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0); fix();
    ctx.fillStyle=css('--sea'); ctx.fillRect(0,0,w,h);
    if(WORLD){ ctx.beginPath(); for(const poly of WORLD) for(const ring of poly) for(const off of ring.shift360 ? [0,ring.shift360] : [0]){
        ring.forEach((p,i)=>{ const [x,y]=toXY(p[0]+off,p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath(); }
      ctx.fillStyle=css('--land'); ctx.fill('evenodd'); ctx.strokeStyle=css('--sea'); ctx.lineWidth=0.8; ctx.stroke();
      if(!WORLD.length){ ctx.fillStyle=css('--muted'); ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('Map could not load. Check your connection.', w/2, h/2); } }
    if(rev){ if(pin){ const [x1,y1]=toXY(pin.lon,pin.lat), [x2,y2]=toXY(q.lon,q.lat);
        ctx.strokeStyle=css('--bad'); ctx.lineWidth=2; ctx.setLineDash([6,5]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); }
      dot(q.lon,q.lat,css('--good')); }
    if(pin) dot(pin.lon,pin.lat,css('--accent'));
  }
  function zoomAt(f,x,y){ const before=toLL(x,y); view.z=clamp(view.z*f,1.15,40); const after=toLL(x,y); view.lon+=before.lon-after.lon; view.lat+=before.lat-after.lat; draw(); }
  if(rev){ // frame both pins, or just the answer if time ran out
    setTimeout(()=>{ w=cv.clientWidth||1; h=cv.clientHeight||1; const p=pin||q;
      const dLon=Math.max(30,Math.abs(p.lon-q.lon)), dLat=Math.max(18,Math.abs(p.lat-q.lat));
      view.z=Math.min(w*0.7/dLon, h*0.6/dLat)/(w/360); view.lon=(p.lon+q.lon)/2; view.lat=(p.lat+q.lat)/2; draw(); },0);
  }
  const ptrs=new Map(); let moved=false, pinch=0;
  const pos = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown', e=>{ try{ cv.setPointerCapture(e.pointerId); }catch(err){} ptrs.set(e.pointerId,{...pos(e),sx:e.clientX,sy:e.clientY}); if(ptrs.size===1) moved=false; else { moved=true; pinch=0; } });
  cv.addEventListener('pointermove', e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const n=pos(e);
    if(ptrs.size===1){ if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>7) moved=true;
      if(moved){ view.lon-=(n.x-p.x)/sc(); view.lat+=(n.y-p.y)/sc(); draw(); } }
    p.x=n.x; p.y=n.y;
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch) zoomAt(d/pinch,(a.x+b.x)/2,(a.y+b.y)/2); pinch=d; } });
  const up = e => { const p=ptrs.get(e.pointerId); if(!p) return; ptrs.delete(e.pointerId); pinch=0;
    if(!moved && !rev && e.type==='pointerup'){ const ll=toLL(p.x,p.y); pin={lat:clamp(ll.lat,-90,90), lon:clamp(ll.lon,-180,180)}; draw(); onReady(); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e=>{ e.preventDefault(); const p=pos(e); zoomAt(e.deltaY<0?1.25:0.8,p.x,p.y); }, {passive:false});
  el.querySelectorAll('[data-z]').forEach(b=>b.addEventListener('click', ()=>zoomAt(Number(b.dataset.z),w/2,h/2)));
  if(window.ResizeObserver) new ResizeObserver(draw).observe(cv);
  draw(); loadWorld().then(draw);
  return () => pin;
}

function graphControl(el,q,{rev,answer,onReady}){

  const VW=600, VH=340, L=56, R=18, T=16, B=48, X=v=>L+(v-x0)/(x1-x0)*(VW-L-R), Y=v=>VH-B-(v/yMax)*(VH-T-B);

  const dp = (x1-x0)>=20 ? 0 : 1; let val = answer!=null ? answer : null;
  function render(){
    const yt=[0,0.25,0.5,0.75,1].map(f=>f*yMax/1.12);
    el.innerHTML = `<svg class="graph" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${esc(q.yLabel)} against ${esc(q.xLabel)}">
      ${yt.map(v=>`<line x1="${L}" x2="${VW-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v<10?v.toFixed(1):Math.round(v)}</text>`).join('')}
      ${xs.map(v=>`<text x="${X(v)}" y="${VH-B+20}" text-anchor="middle">${v}</text>`).join('')}
      <text x="${(L+VW-R)/2}" y="${VH-6}" text-anchor="middle">${esc(q.xLabel)}</text>
      <text x="14" y="${(T+VH-B)/2}" text-anchor="middle" transform="rotate(-90 14 ${(T+VH-B)/2})">${esc(q.yLabel)}</text>
      ${rev ? `<rect x="${X(Math.max(x0,q.answerX-q.tolerance))}" y="${T}" width="${X(Math.min(x1,q.answerX+q.tolerance))-X(Math.max(x0,q.answerX-q.tolerance))}" height="${VH-T-B}" fill="var(--good)" opacity=".22"/>
        <line x1="${X(q.answerX)}" x2="${X(q.answerX)}" y1="${T}" y2="${VH-B}" stroke="var(--good)" stroke-width="3"/>` : ''}
      ${line(q.series,'var(--ink)')}${q.series2 ? line(q.series2,'var(--muted)') : ''}
      ${q.names ? `<text x="${X(x0)+8}" y="${Y(q.series[0][1])-10}">${esc(q.names[0])}</text><text x="${X(x0)+8}" y="${Y(q.series2[0][1])+22}">${esc(q.names[1])}</text>` : ''}
      ${val!=null ? `<line x1="${X(val)}" x2="${X(val)}" y1="${T}" y2="${VH-B}" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 5"/>
        <text x="${clamp(X(val),L+30,VW-R-30)}" y="${T+14}" text-anchor="middle" style="fill:var(--accent);font-weight:600">${val.toFixed(dp)}</text>` : ''}
    </svg><p class="hint">${rev ? (answer!=null ? 'Dashed is your answer, green is the target.' : 'Green is the target.') : 'Tap or drag along the graph to set your answer.'}</p>`;
    if(!rev){ const svg=$('svg',el); let down=false;
      const set=e=>{ const r=svg.getBoundingClientRect(), vx=(e.clientX-r.left)/r.width*VW; val=clamp(x0+(vx-L)/(VW-L-R)*(x1-x0),x0,x1); val=Number(val.toFixed(dp)); render(); onReady(); };
      svg.addEventListener('pointerdown', e=>{ down=true; set(e); });
      svg.addEventListener('pointermove', e=>{ if(e.buttons||e.pointerType==='touch') set(e); });
    }
  }
  render();
  return () => val;
}
TYPES.graphpin = {
  mount:(el,q,onReady)=>graphControl(el,q,{onReady}),
  reveal:(el,q,a)=>{ graphControl(el,q,{rev:true,answer:a}); },
  describe:(q,a)=>`You picked ${a} ${q.xLabel}. The answer is ${q.answerX} ${q.xLabel}.`,
};

function bodySvg(view, inner){
  const limb=(x1,y1,x2,y2,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}"/>`;
  const side=m=>{ const x=v=>m?200-v:v; return limb(x(54),94,x(41),168,20)+limb(x(41),168,x(34),238,16)+`<circle cx="${x(32)}" cy="252" r="9" stroke="none"/>`
    +limb(x(81),236,x(82),318,27)+limb(x(82),318,x(83),404,20)+`<ellipse cx="${x(82)}" cy="424" rx="11" ry="8" stroke="none"/>`; };
  return `<svg class="body" viewBox="0 0 200 440" role="img" aria-label="Body outline, ${view} view">
    <g fill="var(--fig)" stroke="var(--fig)" stroke-linecap="round">
      <circle cx="100" cy="36" r="22" stroke="none"/>${limb(100,58,100,74,16)}
      <path stroke="none" d="M58,86 Q100,70 142,86 L133,150 Q129,186 135,228 Q100,244 65,228 Q71,186 67,150 Z"/>
      ${side(false)}${side(true)}
    </g>
    ${view==='back' ? `<line x1="100" y1="84" x2="100" y2="214" stroke="var(--card)" stroke-width="3" stroke-linecap="round"/>` : `<circle cx="92" cy="34" r="2.5" fill="var(--card)"/><circle cx="108" cy="34" r="2.5" fill="var(--card)"/>`}
    <text x="100" y="12" text-anchor="middle" style="font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;fill:var(--muted)">${view.toUpperCase()}</text>
    ${inner||''}</svg>`;
}
const pinSvg = (p,col) => `<circle cx="${p.x}" cy="${p.y}" r="7" fill="${col}" stroke="#fff" stroke-width="3"/>`;
TYPES.bodypin = {
  mount(el,q,onReady){ let pin=null;
    const render=()=>{ el.innerHTML=`<div class="bodywrap">${bodySvg(q.view, pin?pinSvg(pin,'var(--accent)'):'')}</div><p class="hint">Tap the body to place your pin.</p>`;
      $('svg',el).addEventListener('pointerdown', e=>{ const r=e.currentTarget.getBoundingClientRect();
        pin={x:Math.round((e.clientX-r.left)/r.width*200), y:Math.round((e.clientY-r.top)/r.height*440)}; render(); onReady(); }); };
    render(); return () => pin; },
  reveal(el,q,a){ const n=a ? nearest(q,a).t : null;
    el.innerHTML=`<div class="bodywrap">${bodySvg(q.view, q.targets.map(t=>`<circle cx="${t.x}" cy="${t.y}" r="${q.radius}" fill="var(--good)" opacity=".45"/>`).join('')
      +(a ? `<line x1="${a.x}" y1="${a.y}" x2="${n.x}" y2="${n.y}" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 4"/>`+pinSvg(a,'var(--accent)') : ''))}</div><p class="hint">Green shows the target area.</p>`; },
  describe:(q,a)=>{ const s=score(q,a); return s>=1 ? 'Right on target.' : s>=0.4 ? 'Close, but outside the target area.' : 'Off target.'; },
};

TYPES.order = {
  // the answer is the list of item indexes in the player's order; items are written in the correct order in the bank
  mount(el,q,onReady,seed){ let order=q.items.map((_,i)=>i), sel=-1; const rng=mulberry32(hash('order-'+seed+q.id));
    do { order=shuffle(order,rng); } while(order.every((v,i)=>v===i));
    const render=()=>{ el.innerHTML=`<div class="cards">${order.map((it,pos)=>`<div class="cardrow ${pos===sel?'sel':''}" data-pos="${pos}"><span class="n">${pos+1}</span><span class="t">${esc(q.items[it])}</span>
        <span class="mv"><button type="button" data-mv="-1" aria-label="Move ${esc(q.items[it])} up" ${pos===0?'disabled':''}>↑</button><button type="button" data-mv="1" aria-label="Move ${esc(q.items[it])} down" ${pos===order.length-1?'disabled':''}>↓</button></span></div>`).join('')}</div>
        <p class="hint">Use the arrows, or tap two cards to swap them.</p>`;
      el.querySelectorAll('.cardrow').forEach(row=>{ const pos=Number(row.dataset.pos);
        row.addEventListener('click', e=>{ const mv=e.target.dataset.mv;
          if(mv){ const to=pos+Number(mv); [order[pos],order[to]]=[order[to],order[pos]]; sel=-1; }
          else if(sel===-1) sel=pos; else { [order[pos],order[sel]]=[order[sel],order[pos]]; sel=-1; }
          render(); }); }); };
    render(); onReady(); return () => order.slice(); },
  reveal(el,q,a){ el.innerHTML=`<div class="cards">${(a||[]).map((it,pos)=>{ const d=Math.abs(it-pos);
      return `<div class="cardrow ${d===0?'g':d===1?'o':'b'}"><span class="n">${pos+1}</span><span class="t">${esc(q.items[it])}</span><span class="eyebrow">${d===0?'correct':`should be ${it+1}`}</span></div>`; }).join('')}</div>
      <p class="hint">Correct order: ${q.items.map(esc).join(' → ')}</p>`; },
  describe:(q,a)=>{ const n=a.filter((it,pos)=>it===pos).length; return `${n} of ${a.length} in the right place.`; },
};

// ---------- screens ----------
// Seconds allowed per question. The clock runs on wall time and is saved, so reloading or leaving the tab does not reset it.
const LIMIT = {slider:30, graphpin:30, bodypin:30, order:45, mappin:45};
let session=null, tick=null, qTimer=null;
function shell(inner, {dots}={}){
  clearInterval(tick); clearInterval(qTimer);
  app.innerHTML = `<div class="top"><button class="logo" id="home">The Daily <i>Rep</i></button>
    <div class="tools"><a class="mini" href="higher-lower.html">Higher/Lower</a><button class="mini" id="stats">Stats</button><button class="mini" id="theme" aria-label="Switch light or dark theme">◐</button></div></div>
    ${dots ? `<div class="dots">${dots}</div>` : ''}${inner}`;
  $('#home').addEventListener('click', ()=>{ if(!session || session.review || session.preview || confirm('Leave this round? Your answers so far are saved.')) home(); });
  $('#stats').addEventListener('click', stats);
  $('#theme').addEventListener('click', ()=>{ const dark = data.theme ? data.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    data.theme = dark ? 'light' : 'dark'; save(); applyTheme(); if(session && $('canvas')) render(); });
  window.scrollTo(0,0);
}
function countdown(id){
  const upd=()=>{ const el=$('#'+id); if(!el) return clearInterval(tick); const mid=new Date(); mid.setHours(24,0,0,0); const s=Math.max(0,Math.round((mid-Date.now())/1000));
    el.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; };
  upd(); tick=setInterval(upd,1000);
}
function home(){
  session=null; const n=today(), day=data.days[n], done=day&&day.done, total=done?day.s.reduce((a,b)=>a+b,0):0, st=streakNow();
  const label=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  shell(`<div class="home">
    <div class="eyebrow">#${n} · ${esc(label)}</div>
    <h1>The Daily <i>Rep</i><span class="caret" aria-hidden="true"></span></h1>
    <p class="lede">Five questions. Every day. How well do you know your training?</p>
    ${done ? `<div class="hero"><b>${total}</b><span>today, out of 500 · ${title(total)}</span></div>` : ''}
    <div class="hero streak"><b>🔥 ${st}</b><span>${st ? `day streak${done ? '' : '. Play today to keep it going.'}` : 'day streak. Start one today.'}</span></div>
    <div class="facts two">
      <div class="fact"><b id="cd">--:--:--</b><span>to the next five</span></div>
      <div class="fact"><b>${data.maxStreak}</b><span>longest streak</span></div>
    </div>
    <button class="btn" id="play">${done ? 'See results' : day ? 'Carry on' : "Play today's five"}</button>
    <p class="legal">30 to 45 seconds a question. Closer answers score more. Independent quiz, not affiliated with HYROX or any race series.</p>
  </div>`);
  $('#play').addEventListener('click', ()=>start(n));
  countdown('cd');
}
function start(n, opts={}){
  const qs = opts.qs || pickDaily(n, BANK), saved = opts.preview ? null : data.days[n];
  session = {n, qs, a: saved? saved.a.slice() : [], s: saved? saved.s.slice() : [], preview:!!opts.preview, review:false, i:0, phase:'q'};
  if(saved && saved.done){ session.review=true; return results(); }
  session.i = session.a.length; render();
}
function render(){ session.phase==='q' ? question() : reveal(); }
function dots(){ return session.qs.map((_,i)=> `<i class="${i<session.s.length ? colour(session.s[i]) : i===session.i ? 'on' : ''}"></i>`).join(''); }
function question(){
  const q=session.qs[session.i], limit=LIMIT[q.type];
  const store = session.preview ? session : (data.days[session.n] = data.days[session.n] || {a:[], s:[], done:false});
  if(store.ti!==session.i){ store.ti=session.i; store.t0=Date.now(); if(!session.preview) save(); }
  shell(`<div class="q"><div class="qhead"><span class="eyebrow">Question ${session.i+1} of ${session.qs.length} · ${esc(q.topic)}</span><span class="clock" id="clock" aria-label="Time left"></span></div>
    <div class="timer" id="timer"><i></i></div><h2>${esc(q.q)}</h2>
    <div class="control" id="control"></div><div class="spacer"></div><button class="btn" id="lock" disabled>Lock in</button></div>`, {dots:dots()});
  const lockBtn=$('#lock'), get=TYPES[q.type].mount($('#control'), q, ()=>{ lockBtn.disabled=false; }, session.n);
  const lockIn = a => {
    clearInterval(qTimer);
    session.a[session.i]=a; session.s[session.i]=Math.round(score(q,a)*100); session.phase='reveal';
    if(!session.preview){ Object.assign(data.days[session.n], {a:session.a, s:session.s, done:false}); save(); }
    render();
  };
  lockBtn.addEventListener('click', ()=>{ const a=get(); if(a!=null) lockIn(a); });
  const clock=$('#clock'), bar=$('#timer');
  const upd = () => {
    const left = limit-(Date.now()-store.t0)/1000;
    if(left<=0) return lockIn(lockBtn.disabled ? null : get());   // out of time: whatever is set is locked, or nothing
    clock.textContent=`0:${pad(Math.ceil(left))}`; bar.firstElementChild.style.width=`${left/limit*100}%`;
    clock.classList.toggle('low',left<=5); bar.classList.toggle('low',left<=5);
  };
  upd(); if(session.phase==='q') qTimer=setInterval(upd,100);
}
function reveal(){
  const i=session.i, q=session.qs[i], a=session.a[i], pts=session.s[i], last=i===session.qs.length-1;
  shell(`<div class="q"><div class="eyebrow">Question ${i+1} of ${session.qs.length} · ${esc(q.topic)}</div><h2>${esc(q.q)}</h2>
    <div class="control" id="control"></div>
    <div class="points ${colour(pts)}"><b id="pts">0</b><span>points</span></div>
    <p class="verdict">${a==null ? 'Out of time. Nothing was locked in.' : esc(TYPES[q.type].describe(q,a))}</p>
    <p class="explain">${esc(q.explain)}</p>
    <div class="spacer"></div><button class="btn" id="next">${session.review ? 'Back to results' : last ? 'See results' : 'Next question'}</button></div>`, {dots:dots()});
  TYPES[q.type].reveal($('#control'), q, a);
  const el=$('#pts'); if(reduce || session.review) el.textContent=pts; else { const t0=performance.now(), iv=setInterval(()=>{ const k=Math.min(1,(performance.now()-t0)/600); el.textContent=Math.round(pts*k); if(k>=1 || !el.isConnected) clearInterval(iv); },30); }
  $('#next').addEventListener('click', ()=>{
    if(session.review) return results();
    if(!last){ session.i++; session.phase='q'; return render(); }
    if(!session.preview){ const n=session.n; data.days[n].done=true;
      if(data.last!==n){ data.streak = data.last===n-1 ? data.streak+1 : 1; data.last=n; data.maxStreak=Math.max(data.maxStreak,data.streak); }
      save(); }
    session.review=true; results();
  });
}
function shareText(){
  const total=session.s.reduce((a,b)=>a+b,0), st=streakNow();
  return [`${CONFIG.name} #${session.n} · ${total}/500 · ${title(total)}`, session.s.map(square).join('')+(st>1?` · 🔥 ${st} day streak`:''), CONFIG.url || (/^https?:/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname) ? location.host+location.pathname.replace(/\/$/,'') : '')].filter(Boolean).join('\n');
}
function results(){
  const total=session.s.reduce((a,b)=>a+b,0);
  shell(`<div class="q">
    <div class="eyebrow">#${session.n} · ${session.preview ? 'preview, not saved' : 'today’s result'}</div>
    <div class="score">${total}<small> / ${session.qs.length*100}</small></div>
    <h2>${title(total)}</h2>
    <div class="squares" aria-label="Result by question">${session.s.map(square).join('')}</div>
    <div class="rows">${session.qs.map((q,i)=>`<button class="rowbtn" data-i="${i}"><span>${square(session.s[i])}</span><span class="t">${esc(q.q)}</span><b>${session.s[i]}</b></button>`).join('')}</div>
    <div class="facts">
      <div class="fact"><b>${streakNow()}</b><span>day streak</span></div>
      <div class="fact"><b id="cd">--:--:--</b><span>to the next five</span></div>
      <div class="fact"><b>${Object.values(data.days).filter(d=>d.done).length}</b><span>days played</span></div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="share">Share result</button><p class="hint" id="shareMsg" aria-live="polite"></p></div>`, {dots:dots()});
  app.querySelectorAll('.rowbtn').forEach(b=>b.addEventListener('click', ()=>{ session.i=Number(b.dataset.i); session.phase='reveal'; render(); }));
  $('#share').addEventListener('click', async ()=>{ const t=shareText(), msg=$('#shareMsg');
    if(navigator.share && matchMedia('(pointer:coarse)').matches){ try{ await navigator.share({text:t}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
    try{ await navigator.clipboard.writeText(t); msg.textContent='Copied to clipboard'; }catch(e){ msg.textContent=t; msg.style.whiteSpace='pre-line'; } });
  countdown('cd');
}
function stats(){
  const done=Object.values(data.days).filter(d=>d.done).map(d=>d.s.reduce((a,b)=>a+b,0)), n=done.length;
  const buckets=[0,0,0,0,0]; done.forEach(t=>buckets[Math.min(4,Math.floor(t/100))]++); const max=Math.max(1,...buckets);
  session=null;
  shell(`<div class="q"><h2>Your stats</h2>
    <div class="facts"><div class="fact"><b>${n}</b><span>days played</span></div><div class="fact"><b>${n?Math.round(done.reduce((a,b)=>a+b,0)/n):'—'}</b><span>average</span></div><div class="fact"><b>${n?Math.max(...done):'—'}</b><span>best</span></div></div>
    <div class="facts"><div class="fact"><b>${streakNow()}</b><span>current streak</span></div><div class="fact"><b>${data.maxStreak}</b><span>longest streak</span></div><div class="fact"><b>${BANK.length}</b><span>questions in the bank</span></div></div>
    <div class="eyebrow">Score spread</div>
    <div class="bars">${buckets.map((c,i)=>`<div class="bar"><span>${i*100}–${i===4?500:i*100+99}</span><i style="width:${c/max*100}%"></i><span>${c}</span></div>`).join('')}</div>
    <div class="spacer"></div><button class="btn ghost" id="back">Back</button></div>`);
  $('#back').addEventListener('click', home);
}
// ?bank lists every question with its answer, for fact-checking.
function bank(){
  const ans=q=> q.type==='slider' ? `${q.answer} ${q.unit} (±${q.tolerance})` : q.type==='mappin' ? q.label : q.type==='graphpin' ? `${q.answerX} ${q.xLabel} (±${q.tolerance})` : q.type==='order' ? q.items.join(' → ') : `${q.view} view, ${q.targets.length} target areas`;
  shell(`<h2>Question bank · ${BANK.length}</h2><div class="bank">${BANK.map(q=>`<article><span class="eyebrow">${esc(q.id)} · ${q.type} · ${q.topic} · difficulty ${q.difficulty}</span><b>${esc(q.q)}</b>${esc(ans(q))}<br><span style="color:var(--muted)">${esc(q.explain)}</span><br><a href="?q=${esc(q.id)}" style="color:var(--accent)">Try it</a></article>`).join('')}</div>`);
}

// ---------- start ----------
// ?bank lists the questions, ?q=id,id plays chosen questions, ?day=N previews a day. None of these save.
// They only work on your own machine, so nobody can play ahead or read the answers on the live site.
const local = location.protocol==='file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const params=new URLSearchParams(local ? location.search : '');
if(params.has('bank')) bank();
else if(params.get('q')){ const qs=params.get('q').split(',').map(id=>BANK.find(q=>q.id===id)).filter(Boolean); qs.length ? start(today(),{qs,preview:true}) : home(); }
else if(params.get('day')) start(Math.max(1,Number(params.get('day'))||1),{preview:true});
else home();
})();
</script>
</body>
